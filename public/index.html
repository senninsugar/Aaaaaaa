<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/browser/browser.css">
    <script type="module" src="/browser/main.js"></script>
    <meta name="theme-color" content="#dee1e6">
    <meta name="application-name" content="SenninProxy">
    <title>SenninProxy</title>
</head>

<body class="not-ready">
    <div class="app">
        <header class="chrome">
            <div class="tabstrip">
                <div class="tabs" id="tabs" role="tablist"></div>
                <button class="icon-btn" id="new-tab" type="button" title="新しいタブ (Ctrl+T)" aria-label="新しいタブ">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </div>
            <div class="toolbar">
                <button class="icon-btn" id="back" type="button" title="戻る (Alt+←)" aria-label="戻る">
                    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <button class="icon-btn" id="forward" type="button" title="進む (Alt+→)" aria-label="進む">
                    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <button class="icon-btn" id="reload" type="button" title="再読み込み (Ctrl+R)" aria-label="再読み込み">
                    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
                </button>
                <form class="address" id="address-form" autocomplete="off">
                    <span class="address-icon" id="address-icon"></span>
                    <input id="address" type="text" spellcheck="false" placeholder="検索またはURLを入力" aria-label="アドレス">
                </form>
                <button class="icon-btn" id="settings-btn" type="button" title="設定" aria-label="設定">
                    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
                </button>
            </div>
            <div class="progress" id="progress"></div>
        </header>

        <main class="viewport" id="viewport">
            <section class="newtab" id="newtab">
                <div class="newtab-brand" aria-label="SenninProxy">
                    <div class="brand-mark"><span></span><span></span><span></span></div>
                    <div class="brand-name">Sennin<span>Proxy</span></div>
                </div>
                <p class="newtab-caption">検索するか、ウェブサイトのアドレスを入力してください</p>
                <form class="newtab-search" id="newtab-form" autocomplete="off">
                    <input id="newtab-search" type="text" spellcheck="false" placeholder="検索またはURLを入力" aria-label="検索">
                </form>
                <div class="shortcuts" id="shortcuts"></div>
            </section>
        </main>
    </div>

    <div class="modal" id="lock-modal" hidden>
        <form class="dialog" id="lock-form" autocomplete="off">
            <h2>パスワードが必要です</h2>
            <p class="muted">このプロキシはパスワードで保護されています。管理者から受け取ったパスワードを入力してください。</p>
            <input class="field" id="lock-password" type="password" placeholder="パスワード" autocomplete="current-password">
            <p class="error" id="lock-error" hidden></p>
            <div class="dialog-actions">
                <button class="btn primary" type="submit">開く</button>
            </div>
        </form>
    </div>

    <div class="modal" id="settings-modal" hidden>
        <form class="dialog wide" id="settings-form" autocomplete="off">
            <div class="dialog-head">
                <h2>設定</h2>
                <button class="icon-btn" id="settings-close" type="button" aria-label="閉じる">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <label class="field-row">
                <span>検索エンジン</span>
                <select class="field" id="set-search"></select>
            </label>
            <label class="field-row">
                <span>HTTPプロキシ</span>
                <input class="field" id="set-httpproxy" type="text" spellcheck="false" placeholder="http://user:pass@host:port">
            </label>
            <label class="field-row check">
                <span>URLシャッフル<small class="muted">URLを難読化して送信します</small></span>
                <input id="set-shuffle" type="checkbox">
            </label>
            <div class="dialog-actions">
                <button class="btn primary" type="submit">保存</button>
            </div>
            <div class="divider"></div>
            <div class="danger-row">
                <div>
                    <strong>セッションをリセット</strong>
                    <p class="muted">ログイン情報・クッキーを消去し、新しいセッションを作成します。</p>
                </div>
                <button class="btn danger" id="session-reset" type="button">リセット</button>
            </div>
            <div class="danger-row">
                <div>
                    <strong>保存済みパスワード</strong>
                    <p class="muted">この端末に保存されたパスワードを消去します。</p>
                </div>
                <button class="btn" id="password-clear" type="button">消去</button>
            </div>
            <p class="muted small"><a href="/classic.html">従来の管理画面を開く</a></p>
        </form>
    </div>

    <div class="toast" id="toast" hidden></div>
</body>

</html>
